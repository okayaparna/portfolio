<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — Aparna</title>
  </head>
  <body class="projects">
    <header class="mark">
      <a href="index.html">
        <span class="mark__dot"></span>
        Aparna
      </a>
    </header>

    <main class="projects__field" id="field"></main>

    <!-- Mini cluster nav (mirrors the home cluster) -->
    <nav class="projects__nav" aria-label="Primary">
      <span aria-hidden="true" id="mini-cross"></span>
      <a href="index.html" aria-label="Home" id="mini-home"></a>
      <a href="info.html" aria-label="Info" id="mini-info"></a>
      <span class="is-current" aria-hidden="true" id="mini-projects"></span>
      <span aria-hidden="true" id="mini-flower"></span>
      <span aria-hidden="true" id="mini-plus"></span>
    </nav>

    <script type="module" src="/src/projects.js"></script>
    <script type="module">
      import { glyphs } from '/src/glyphs.js'
      const set = (id, svg) => { const el = document.getElementById(id); if (el) el.innerHTML = svg }
      set('mini-cross',    glyphs.cross)
      set('mini-home',     glyphs.bud)
      set('mini-info',     glyphs.infoI)
      set('mini-projects', glyphs.dots3)
      set('mini-flower',   glyphs.flower4)
      set('mini-plus',     glyphs.plusFlower)
    </script>
  </body>
</html>
