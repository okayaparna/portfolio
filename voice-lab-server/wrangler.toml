name = "voice-lab-token"
main = "worker.js"
compatibility_date = "2026-01-01"

# Account-wide per-IP rate limit. The Worker also applies a smaller in-isolate
# limit on its own, so it is never completely unmetered if this is removed.
# `namespace_id` is any number you pick and keep stable; `period` must be 10 or 60.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
