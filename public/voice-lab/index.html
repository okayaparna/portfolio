<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ash Voice Lab</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<style>
  :root{
    --page:#F1EFEA; --card:#FFFFFF; --ink:#1C1C1E; --ink-2:#6E6E73; --ink-3:#A1A1A6;
    --well:#F2F2F0; --well-2:#E8E7E3; --thumb:#1C1C1E; --radius:20px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(0,0,0,.10);
    --stage:#FFFDFA; --wave:#DDDAD1;
  }
  [data-theme="dark"]{
    --page:#121211; --card:#1F1E1D; --ink:#F3F2EF; --ink-2:#9A9891; --ink-3:#6B6963;
    --well:#2A2927; --well-2:#343330; --thumb:#F3F2EF;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    --stage:#1A1918; --wave:#272725;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--page); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.35; -webkit-font-smoothing:antialiased;
    transition:background .3s, color .3s}
  .lab{display:grid; grid-template-columns:310px minmax(0,1fr); gap:18px;
    padding:16px 20px 20px; max-width:1340px; margin:0 auto; min-height:100vh}
  @media (max-width:980px){ .lab{grid-template-columns:1fr} }

  /* Above the breakpoint both columns share one row height, so the preview and the
     transport finish level with the bottom of the control panel. The canvas takes
     whatever height is left instead of dictating it through an aspect ratio. */
  @media (min-width:981px){
    .lab{height:100vh; min-height:0; align-items:stretch}
    .panel{display:flex; flex-direction:column; min-height:0}
    .pane.is-on{flex:1 1 auto; min-height:0; overflow-y:auto}
    .stage{min-height:0}
    .canvas-card{flex:1 1 auto; aspect-ratio:auto; min-height:0}
    .card--pad{flex:0 0 auto}
  }

  .topbar{grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; margin-bottom:2px}
  .wordmark{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink)}
  .wordmark__logo{height:16px; width:auto; display:block; fill:currentColor}
  .wordmark span{color:var(--ink-3)}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); transition:background .3s}
  .panel{padding:0; overflow:hidden}
  .tabs{display:flex; gap:4px; padding:10px 10px 0}
  .tab{flex:1; border:none; background:transparent; border-radius:11px; padding:9px 8px; cursor:pointer;
    font:inherit; font-size:14px; font-weight:500; color:var(--ink-3); transition:background .15s,color .15s}
  .tab.is-on{background:var(--well); color:var(--ink)}
  .tab:hover:not(.is-on){color:var(--ink-2)}
  .tabline{height:1px; background:var(--well-2); margin:12px 0 0}
  .pane{padding:18px 22px 22px; display:none}
  .pane.is-on{display:block}

  .group{margin-bottom:18px} .group:last-child{margin-bottom:0}
  .row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 8px}
  .label{font-size:15px} .value{color:var(--ink-2); font-size:15px; font-variant-numeric:tabular-nums}
  .sublabel{font-size:15px; margin:0 0 9px}

  .slider{-webkit-appearance:none; appearance:none; width:100%; height:24px; background:transparent; margin:0; cursor:pointer}
  .slider:focus{outline:none}
  .slider::-webkit-slider-runnable-track{height:4px; border-radius:2px;
    background:linear-gradient(to right, var(--thumb) 0 var(--p,50%), var(--well-2) var(--p,50%) 100%)}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--thumb); margin-top:-8px; border:none; box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .slider::-moz-range-track{height:4px; border-radius:2px; background:var(--well-2)}
  .slider::-moz-range-progress{height:4px; border-radius:2px; background:var(--thumb)}
  .slider::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:var(--thumb); border:none}
  .slider:disabled{opacity:.35; cursor:default}

  .meter{height:6px; border-radius:3px; background:var(--well-2); overflow:hidden}
  .meter__fill{height:100%; width:0%; background:var(--thumb); border-radius:3px}
  .seg{display:flex; background:var(--well); border-radius:14px; padding:4px; gap:2px}
  .seg__opt{flex:1; border:none; background:transparent; border-radius:10px; padding:9px 8px; cursor:pointer;
    color:var(--ink-3); font:inherit; display:flex; align-items:center; justify-content:center;
    transition:background .15s,color .15s,box-shadow .15s}
  .seg__opt svg{width:20px;height:20px}
  .seg__opt.is-on{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .swatches{display:flex; gap:10px; flex-wrap:wrap}
  .sw{width:32px; height:32px; border-radius:50%; border:none; cursor:pointer; padding:0;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); transition:box-shadow .15s, transform .1s}
  .sw:active{transform:scale(.94)}
  .sw.is-on{box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--sw)}

  .voices{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .voice{display:flex; align-items:center; gap:8px; border:none; background:var(--well); border-radius:12px;
    padding:9px 10px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; text-align:left;
    transition:background .15s, box-shadow .15s}
  .voice:hover{background:var(--well-2)}
  .voice.is-on{background:var(--card); box-shadow:0 0 0 1.5px var(--ink) inset}
  .voice__dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex:none}
  .voice.is-on .voice__dot{background:var(--trim,#8A4D75)}
  .voice__meta{color:var(--ink-3); font-size:11px; margin-left:auto}

  .field{display:flex; align-items:center; gap:10px; background:var(--well); border-radius:13px; padding:11px 13px; width:100%}
  .field select{appearance:none; -webkit-appearance:none; border:none; background:transparent; font:inherit;
    font-size:15px; color:var(--ink); flex:1; cursor:pointer; outline:none; padding:0}
  .field__chev{color:var(--ink-3); display:flex}

  .toggle{position:relative; width:49px; height:28px; border-radius:14px; background:var(--well-2); border:none;
    cursor:pointer; padding:0; transition:background .18s; flex:none}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s}
  .toggle.is-on{background:var(--thumb)}
  .toggle.is-on::after{transform:translateX(21px)}
  [data-theme="dark"] .toggle.is-on::after{background:#1A1918}

  /* theme switch, top right */
  .theme{display:flex; background:var(--card); border-radius:999px; padding:4px; gap:2px; box-shadow:var(--shadow)}
  .theme button{border:none; background:transparent; border-radius:999px; width:38px; height:32px; cursor:pointer;
    color:var(--ink-3); display:flex; align-items:center; justify-content:center; transition:background .15s,color .15s}
  .theme button svg{width:18px;height:18px}
  .theme button.is-on{background:var(--well); color:var(--ink)}

  /* stage */
  .stage{display:flex; flex-direction:column; gap:14px; min-width:0}
  .canvas-card{position:relative; aspect-ratio:16/10; overflow:hidden; background:var(--stage); transition:background .3s}
  #display{width:100%; height:100%; display:block}
  .stage__badge{position:absolute; top:18px; left:22px; display:flex; gap:8px; align-items:center; pointer-events:none}
  .badge{border-radius:999px; padding:6px 12px; font-size:13px; color:var(--ink-2); background:var(--card);
    display:inline-flex; align-items:center; gap:8px; opacity:.9}
  .badge__dot{width:8px;height:8px;border-radius:50%;background:var(--trim,#8A4D75)}
  .badge__dot.is-live{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .try{position:absolute; top:16px; right:16px; display:inline-flex; align-items:center; gap:8px;
    border:none; border-radius:999px; padding:9px 14px; cursor:pointer; font:inherit; font-size:14px;
    background:var(--thumb); color:var(--card); box-shadow:var(--shadow); transition:background .15s, transform .08s}
  .try:active{transform:scale(.97)}
  .try svg{width:17px;height:17px}
  .try.is-live{background:#D93025; color:#fff}
  .try.is-denied{background:var(--well); color:var(--ink-3); cursor:not-allowed}
  /* voice mode: the app's screen, inside the preview box */
  .vm{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between;
    pointer-events:none; z-index:2}
  .vm[hidden]{display:none}
  .vm__bar{display:flex; align-items:center; padding:18px 20px; pointer-events:auto}
  .vm__back{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:var(--well); color:var(--ink); display:flex; align-items:center; justify-content:center}
  .vm__back svg{width:19px;height:19px}
  .vm__title{flex:1; text-align:center; font-size:18px; font-weight:600; margin-left:-38px}
  .vm__spacer{width:38px}
  .vm__foot{padding:0 20px 26px; text-align:center; pointer-events:auto}
  .vm__status{font-size:14px; color:var(--ink-3); min-height:20px; letter-spacing:.01em}
  .vm__said{font-size:15px; color:var(--ink-2); min-height:22px; margin-top:4px;
    max-width:70%; margin-inline:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .vm__name{margin-top:10px; font-size:20px; font-weight:600; color:var(--trim,#8A4D75)}
  .vm__dots{display:flex; gap:8px; justify-content:center; margin-top:12px}
  .vm__dot{width:8px;height:8px;border-radius:50%;background:var(--well-2); border:none; padding:0; cursor:pointer}
  .vm__dot.is-on{background:var(--ink)}
  .canvas-card.is-vm .stage__badge{display:none}
  .transport{display:flex; align-items:center; gap:12px}
  .play{width:47px;height:47px;border-radius:50%;border:none;background:var(--thumb);color:var(--card);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .play svg{width:20px;height:20px}
  .wave-wrap{position:relative; flex:1; height:76px; border-radius:14px; background:var(--well); overflow:hidden; cursor:pointer}
  .wave-wrap canvas{width:100%;height:100%;display:block}
  .playhead{position:absolute; top:0; bottom:0; width:2px; background:var(--ink); left:0; pointer-events:none; opacity:.55}
  .time{color:var(--ink-2); font-size:13px; font-variant-numeric:tabular-nums; min-width:9.5ch; text-align:right}
  .tfoot{color:var(--ink-3); font-size:13px; margin-top:12px; display:flex; justify-content:space-between; gap:12px}
  .tfoot b{color:var(--ink-2); font-weight:500}
  .tfoot input{display:none}
  .linklike{color:var(--ink); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:13px}
  .card--pad{padding:18px 22px}
</style>
</head>
<body data-theme="light">
<div class="lab">

  <div class="topbar">
    <div class="wordmark">
      <svg class="wordmark__logo" viewBox="0 0 57 27" role="img" aria-label="Ash">
        <path d="M30.5518 9.04046C34.5942 9.04046 37.2251 10.8818 37.8498 13.9712H34.3979C34.1356 12.0325 32.8861 10.717 30.453 10.717C28.6446 10.717 27.4939 11.4736 27.4939 12.7876C27.4939 14.4642 29.1375 15.1548 32.161 16.2066C35.6775 17.4232 38.0447 18.6068 38.0447 21.4985C38.0447 24.7198 35.0542 26.2974 31.2081 26.2974C26.6069 26.2974 23.615 24.062 23.155 20.4138H26.6714C26.9681 23.0432 28.4798 24.6209 31.2397 24.6209C33.1469 24.6209 34.5268 23.8313 34.5268 22.3196C34.5268 20.643 33.1455 20.1171 29.7938 18.902C26.7044 17.7843 24.009 16.6666 24.009 13.6431C24.009 10.7829 26.7044 9.04189 30.5504 9.04189L30.5518 9.04046ZM43.8969 0.133264C43.7321 1.11913 43.6662 1.9746 43.6662 4.63701V13.2161C44.685 10.8818 46.7886 9.04189 49.878 9.04189C53.0993 9.04189 55.1369 10.8173 55.1369 15.3196V21.1703C55.1369 23.5691 55.3017 24.7857 56.4194 25.6082V25.74H50.0428V25.6082C51.0616 24.7871 51.2264 23.5705 51.2264 21.1703V15.4515C51.2264 12.5583 50.1746 11.3432 48.104 11.3432C45.7697 11.3432 44.1921 13.1516 43.6662 15.387V21.1718C43.6662 23.5705 43.8639 24.7871 45.0146 25.6096V25.7414H38.4073V25.6096C39.5909 24.7885 39.7872 23.572 39.7872 21.1718V4.63558C39.7872 2.66385 39.5565 1.54615 38.5706 0.723638V0.624765L43.8625 0L43.8954 0.131831L43.8969 0.133264ZM22.023 22.0244C22.6807 23.7998 23.3699 24.9161 24.4876 25.6068V25.7386H16.6652V25.6397C17.9806 24.9161 18.0781 23.8313 17.4547 22.0573L16.1393 18.2443H6.60732L5.32483 21.9585C4.66711 23.9302 4.73302 24.949 5.88368 25.6397V25.7386H0V25.6397C1.15066 24.9161 2.10357 23.8643 2.8272 21.8596L9.69675 3.09087C9.99193 2.23683 9.99193 1.51319 9.76266 0.855469H14.0687L22.023 22.0244ZM7.2636 16.4029H15.5145L11.4063 4.43783L7.26504 16.4029H7.2636Z"/>
      </svg>
      <span>· Rive + voice</span>
    </div>
    <div class="theme" id="theme">
      <button data-v="light" class="is-on" aria-label="Light mode" title="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button data-v="dark" aria-label="Dark mode" title="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>

  <!-- LEFT PANEL -->
  <aside class="card panel">
    <div class="tabs" id="tabs">
      <button class="tab is-on" data-v="voice">Voice</button>
      <button class="tab" data-v="response">Response</button>
      <button class="tab" data-v="look">Look</button>
    </div>
    <div class="tabline"></div>

    <!-- VOICE -->
    <section class="pane is-on" data-pane="voice">
      <div class="group"><div class="voices" id="voices"></div></div>
      <div class="group">
        <p class="sublabel">Voice sample</p>
        <div class="field">
          <select id="audio-select"></select>
          <span class="field__chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
        </div>
      </div>
      <div class="row"><span class="label">Drive from audio</span>
        <button class="toggle is-on" id="tg-audio" role="switch" aria-checked="true"></button></div>
      <div class="group" style="margin-top:16px">
        <div class="row"><span class="label">Amplitude</span><span class="value" id="v-amp">0.50</span></div>
        <input class="slider" type="range" id="s-amp" min="0" max="1" step="0.01" value="0.5" disabled />
      </div>
    </section>

    <!-- RESPONSE -->
    <section class="pane" data-pane="response">
      <div class="group">
        <div class="row"><span class="label">Gain</span><span class="value" id="v-gain">1.4×</span></div>
        <input class="slider" type="range" id="s-gain" min="0.3" max="3" step="0.05" value="1.4" />
      </div>
      <div class="group">
        <div class="row"><span class="label">Attack</span><span class="value" id="v-attack">40 ms</span></div>
        <input class="slider" type="range" id="s-attack" min="0" max="300" step="5" value="40" />
      </div>
      <div class="group">
        <div class="row"><span class="label">Release</span><span class="value" id="v-release">180 ms</span></div>
        <input class="slider" type="range" id="s-release" min="20" max="1200" step="10" value="180" />
      </div>
      <div class="group">
        <div class="row"><span class="label">Noise floor</span><span class="value" id="v-floor">0.04</span></div>
        <input class="slider" type="range" id="s-floor" min="0" max="0.3" step="0.005" value="0.04" />
      </div>
      <div class="group">
        <p class="sublabel">Curve</p>
        <div class="seg" id="seg-curve">
          <button class="seg__opt" data-v="soft" title="Soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19C8 19 12 5 20 5"/></svg></button>
          <button class="seg__opt is-on" data-v="linear" title="Linear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19L20 5"/></svg></button>
          <button class="seg__opt" data-v="punchy" title="Punchy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19C4 11 12 5 20 5"/></svg></button>
        </div>
      </div>
      <div class="group">
        <div class="row"><span class="label">Live</span><span class="value" id="v-live">0.00</span></div>
        <div class="meter"><div class="meter__fill" id="meter"></div></div>
      </div>
    </section>

    <!-- LOOK -->
    <section class="pane" data-pane="look">
      <div class="group">
        <p class="sublabel">Trim path colour</p>
        <div class="swatches" id="sw-trim"></div>
      </div>
    </section>
  </aside>

  <!-- STAGE -->
  <main class="stage">
    <section class="card canvas-card" id="canvas-card">
      <div class="stage__badge">
        <span class="badge"><span class="badge__dot" id="live-dot"></span><span id="badge-voice">Willow</span></span>
        <span class="badge" id="badge-file">willow · path</span>
      </div>
      <div class="vm" id="vm" hidden>
        <div class="vm__bar">
          <button class="vm__back" id="vm-back" aria-label="Leave voice mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          </button>
          <span class="vm__title">Voice</span>
          <span class="vm__spacer"></span>
        </div>
        <div class="vm__foot">
          <div class="vm__status" id="vm-status">Tap to speak</div>
          <div class="vm__said" id="vm-said"></div>
          <div class="vm__name" id="vm-name">Willow</div>
          <div class="vm__dots" id="vm-dots"></div>
        </div>
      </div>
      <button class="try" id="btn-try">
        <svg id="ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
        <svg id="ic-stop" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span id="try-label">Try</span>
      </button>
      <canvas id="display"></canvas>
    </section>

    <section class="card card--pad">
      <div class="transport">
        <button class="play" id="btn-play" aria-label="Play">
          <svg id="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg id="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <div class="wave-wrap" id="wave-wrap"><canvas id="wave"></canvas><div class="playhead" id="playhead"></div></div>
        <span class="time" id="time">0:00.00 / 0:00.00</span>
      </div>
      <div class="tfoot">
        <span>Sample <b id="file-name">—</b></span>
        <label><input type="file" id="file-input" accept="audio/*" /><span class="linklike">Upload your own audio…</span></label>
      </div>
    </section>
  </main>
</div>

<audio id="audio" preload="auto"></audio>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Geometry is TRACED from the real .riv renders (paths.json): each voice is a
  // 180-point centreline recovered by ridge-following the rendered stroke, so the
  // shapes are the shipped ones -- Willow's notch, Spring's three petals, River's
  // lasso -- not an approximation. Points are normalised: centred on the shape,
  // longer axis spanning 2.0 units. `strokeRel` is the stroke width in those units.
  // Rive itself is not loaded: its `amplitude` binding is inert, and a bitmap
  // cannot be trimmed along its own arc length.
  // ---------------------------------------------------------------------------
  let PATHS = {};

  const VOICES = [
    { id:'willow',  label:'Willow',  wav:'01_Willow__ashley_v2.wav' },
    { id:'spring',  label:'Spring',  wav:'02_Spring__autumn_v2.wav' },
    { id:'cedar',   label:'Cedar',   wav:'07_Cedar__lamdavo_new.wav' },
    { id:'river',   label:'River',   wav:'06_River__neil.wav' },
    { id:'mist',    label:'Mist',    wav:'08_Mist__jason_new.wav' },
    { id:'meadow',  label:'Meadow',  wav:'09_Meadow__monica_p.wav' },
    { id:'ember',   label:'Ember',   wav:'01_Willow__ashley_v2.wav' },
    { id:'flint',   label:'Flint',   wav:'04_Granite__daniel_v2.wav' },
    { id:'hazel',   label:'Hazel',   wav:'02_Spring__autumn_v2.wav' },
    { id:'canyon',  label:'Canyon',  wav:'05_Pine__rory_v2.wav',      legacy:true },
    { id:'dawn',    label:'Dawn',    wav:'09_Meadow__monica_p.wav',   legacy:true },
    { id:'granite', label:'Granite', wav:'04_Granite__daniel_v2.wav', legacy:true },
    { id:'maple',   label:'Maple',   wav:'03_Cedar__lamdavo_v2.wav',  legacy:true },
  ];
  const SAMPLES = [
    ['01_Willow__ashley_v2.wav','Willow · ashley v2'], ['02_Spring__autumn_v2.wav','Spring · autumn v2'],
    ['03_Cedar__lamdavo_v2.wav','Cedar · lamdavo v2'], ['07_Cedar__lamdavo_new.wav','Cedar · lamdavo new'],
    ['04_Granite__daniel_v2.wav','Granite · daniel v2'], ['05_Pine__rory_v2.wav','Pine · rory v2'],
    ['06_River__neil.wav','River · neil'], ['08_Mist__jason_new.wav','Mist · jason new'],
    ['09_Meadow__monica_p.wav','Meadow · monica p'],
  ];
  const TRIMS = ['#8A4D75','#00ADF4','#C46507','#D4574A','#598672','#7A832E'];
  const THEME = { light:{stage:'#FFFDFA', wave:'#DDDAD1'}, dark:{stage:'#1A1918', wave:'#272725'} };

  const WOBBLE   = 0.34;   // peak normal displacement, in normalised units
                           // (fbm rarely reaches +/-1 and the ends are pinned, so the
                           //  real peak lands near 8% of the shape, not 34%)
  const NOISE_FREQ = 3.2;  // along the path
  const NOISE_SPEED = 1.1; // over time
  const SEED = 42;

  const S = { voice:VOICES[0], sample:VOICES[0].wav, driveAudio:true, manualAmp:.5,
              gain:1.4, attack:40, release:180, floor:.04, curve:'linear',
              trim:TRIMS[0], theme:'light', live:false, voiceMode:false };

  const $ = id => document.getElementById(id);
  const audio=$('audio'), display=$('display'), canvasCard=$('canvas-card');
  const waveWrap=$('wave-wrap'), playhead=$('playhead');
  const dctx = display.getContext('2d');

  // ---------------- noise (roughen_path.html) ----------------
  const lerp=(a,b,t)=>a+(b-a)*t;
  const seededRandom = s => { const x=Math.sin(s*127.1+311.7)*43758.5453; return x-Math.floor(x); };
  function noise1D(x,seed){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f);
    return lerp(seededRandom(i+seed*1000), seededRandom(i+1+seed*1000), u)*2-1; }
  function fbmNoise(x,octaves,seed){
    let v=0,a=1,f=1,m=0;
    for(let i=0;i<octaves;i++){ v+=noise1D(x*f,seed+i*17)*a; m+=a; a*=.5; f*=2; }
    return v/m;
  }

  // ---------------- envelopes ----------------
  let ENVS={}, currentEnv=null, customEnvs={};
  Promise.all([
    fetch('./paths.json').then(r=>r.json()).catch(()=>({})),
    fetch('./envelopes.json').then(r=>r.json()).catch(()=>({})),
  ]).then(([p,e])=>{ PATHS=p; ENVS=e; setSample(S.sample); });

  const envAt = t => { if(!currentEnv) return 0;
    const i=Math.min(currentEnv.env.length-1, Math.max(0, Math.floor(t*currentEnv.fps)));
    return currentEnv.env[i]||0; };

  let follower=0, lastT=performance.now();
  function shapeAmp(x){
    x = Math.max(0, x - S.floor)/Math.max(1e-6, 1 - S.floor);
    x = Math.min(1, x*S.gain);
    if(S.curve==='soft')   x = Math.pow(x,1.6);
    if(S.curve==='punchy') x = Math.pow(x,.55);
    return x;
  }
  function follow(now){
    const dt=Math.min(.1,(now-lastT)/1000); lastT=now;
    let target;
    if(S.live)            target = shapeAmp(micLevel);
    else if(S.driveAudio) target = audio.paused ? 0 : shapeAmp(envAt(audio.currentTime));
    else                  target = shapeAmp(S.manualAmp);
    const tau=(target>follower ? S.attack : S.release)/1000;
    follower += (target-follower)*(tau<=0 ? 1 : 1-Math.exp(-dt/tau));
    return follower;
  }

  // ---------------- geometry ----------------
  let SMOOTH_WIN = 1, SMOOTH_PASS = 1, RDP_REL = 0.05;   // low-pass on the traced centreline
  const CACHE = {};

  // Tiny self-loops appear where the tracer overshot a sharp corner. If a point
  // comes back within a hair of an earlier one, drop everything between them.
  function cutLoops(pts, tol){
    const out=[];
    for(let i=0;i<pts.length;i++){
      let hit=-1;
      for(let j=out.length-2;j>=0 && j>out.length-26;j--){
        if(Math.hypot(pts[i].x-out[j].x, pts[i].y-out[j].y) < tol){ hit=j; break; }
      }
      if(hit>=0) out.length=hit+1; else out.push(pts[i]);
    }
    return out;
  }
  // Ramer-Douglas-Peucker. Drops points that sit on an almost-straight run --
  // i.e. the sub-pixel jitter the tracer leaves -- while always keeping the point
  // of greatest deviation, so peaks and corners survive untouched.
  function rdp(pts, eps){
    if(pts.length<3) return pts.slice();
    const a=pts[0], b=pts[pts.length-1];
    const dx=b.x-a.x, dy=b.y-a.y, nl=Math.hypot(dx,dy);
    let worst=-1, wi=0;
    for(let i=1;i<pts.length-1;i++){
      const q=pts[i];
      const d = nl ? Math.abs(dy*q.x - dx*q.y + b.x*a.y - b.y*a.x)/nl
                   : Math.hypot(q.x-a.x, q.y-a.y);
      if(d>worst){ worst=d; wi=i; }
    }
    if(worst>eps) return rdp(pts.slice(0,wi+1),eps).slice(0,-1).concat(rdp(pts.slice(wi),eps));
    return [a,b];
  }

  // Moving-average low-pass, endpoints pinned.
  function smoothPts(pts, win, passes){
    for(let p=0;p<passes;p++){
      const out=[pts[0]];
      for(let i=1;i<pts.length-1;i++){
        let sx=0, sy=0, n=0;
        for(let k=-win;k<=win;k++){
          const j=Math.min(pts.length-1, Math.max(0, i+k));
          sx+=pts[j].x; sy+=pts[j].y; n++;
        }
        out.push({x:sx/n, y:sy/n});
      }
      out.push(pts[pts.length-1]);
      pts=out;
    }
    return pts;
  }

  function base(id){
    if(CACHE[id]) return CACHE[id];
    const p = PATHS[id]; if(!p) return null;
    let pts = p.pts.map(q=>({x:q[0], y:q[1]}));
    // The tracer may have walked a shape right-to-left. Normalise every path to
    // run left-to-right so the trim reads the same way for every voice: grey
    // behind the playhead, colour ahead of it.
    if(pts[0].x > pts[pts.length-1].x) pts.reverse();
    // NB: no loop-cutting here. A tight notch (Willow) or a petal (Spring)
    // legitimately returns close to an earlier point, and removing those
    // flattened the shapes into plain S-curves. The high-resolution trace is
    // clean enough that a gentle low-pass is all that is wanted.
    pts = smoothPts(pts, SMOOTH_WIN, SMOOTH_PASS);
    // arc position of every point, 0..1 -- the noise is indexed by this, so the
    // wobble travels along the path rather than across the screen
    const L=[0];
    for(let i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    const total=L[L.length-1]||1;
    const n = pts.map((_,i)=>{
      const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
      const dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1;
      return {x:-dy/l, y:dx/l};
    });
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(const q of pts){ x0=Math.min(x0,q.x); y0=Math.min(y0,q.y); x1=Math.max(x1,q.x); y1=Math.max(y1,q.y); }
    const m = WOBBLE + (p.strokeRel||0.12)/2 + 0.04;
    return (CACHE[id] = { pts, n, s:L.map(v=>v/total), total,
      strokeRel:p.strokeRel||0.12,
      box:{ cx:(x0+x1)/2, cy:(y0+y1)/2, w:(x1-x0)+2*m, h:(y1-y0)+2*m } });
  }

  // Displace each point along its own normal. The shape is preserved -- it
  // breathes along its length instead of being scaled or squashed.
  function deform(b, t, amp){
    if(amp < 0.002) return b.pts;
    return b.pts.map((q,i)=>{
      const d = fbmNoise(b.s[i]*NOISE_FREQ + t*NOISE_SPEED, 3, SEED) * amp * WOBBLE
              * Math.sin(Math.PI*Math.min(1,Math.max(0,b.s[i])));   // pin the two ends
      return { x:q.x + b.n[i].x*d, y:q.y + b.n[i].y*d };
    });
  }
  function arcLengths(pts){
    const L=[0];
    for(let i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
    return L;
  }
  function trimByArc(pts,L,f0,f1){
    const total=L[L.length-1]; if(total<=0) return [];
    const s0=Math.max(0,Math.min(1,f0))*total, s1=Math.max(0,Math.min(1,f1))*total;
    if(s1<=s0) return [];
    const at=s=>{ let i=1; while(i<L.length && L[i]<s) i++;
      if(i>=L.length) return pts[pts.length-1];
      const u=(s-L[i-1])/Math.max(1e-9,(L[i]-L[i-1]));
      return { x:lerp(pts[i-1].x,pts[i].x,u), y:lerp(pts[i-1].y,pts[i].y,u) }; };
    const out=[at(s0)];
    for(let i=0;i<pts.length;i++) if(L[i]>s0 && L[i]<s1) out.push(pts[i]);
    out.push(at(s1));
    return out;
  }
  function strokePath(ctx,pts,colour,width){
    if(pts.length<2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    if(pts.length===2){
      ctx.lineTo(pts[1].x,pts[1].y);
    } else {
      // Catmull-Rom -> cubic bezier. Unlike quadratic-through-midpoints this
      // INTERPOLATES every traced point, so a sharp peak stays a peak instead of
      // being rounded off, while the run between points is still a smooth curve.
      const n=pts.length;
      for(let i=0;i<n-1;i++){
        const p0=pts[i>0?i-1:0], p1=pts[i], p2=pts[i+1], p3=pts[i+2<n?i+2:n-1];
        ctx.bezierCurveTo(
          p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6,
          p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6,
          p2.x, p2.y);
      }
    }
    ctx.strokeStyle=colour; ctx.lineWidth=width;
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
  }

  // ---------------- draw ----------------
  let livePos = 0;                       // trim position while the mic is open
  function progress(){
    if(S.voiceMode) return livePos;
    const d = audio.duration || (currentEnv && currentEnv.duration_s) || 0;
    return d ? Math.min(1, Math.max(0, audio.currentTime/d)) : 0;
  }
  function draw(now){
    const dpr=window.devicePixelRatio||1;
    const cw=canvasCard.clientWidth, chh=canvasCard.clientHeight;
    if(display.width!==cw*dpr || display.height!==chh*dpr){
      display.width=cw*dpr; display.height=chh*dpr;
      display.style.width=cw+'px'; display.style.height=chh+'px';
    }
    const th=THEME[S.theme];
    dctx.setTransform(1,0,0,1,0,0);
    dctx.fillStyle=th.stage; dctx.fillRect(0,0,display.width,display.height);

    const b=base(S.voice.id); if(!b) return;
    // Scale comes only from the static box, never from the deformed geometry --
    // otherwise the drawing appears to resize as the voice plays.
    const k=Math.min(cw/b.box.w, chh/b.box.h)*0.94*dpr;
    dctx.setTransform(k,0,0,k, display.width/2 - b.box.cx*k, display.height/2 - b.box.cy*k);

    const pts=deform(b, now/1000, follower);
    const w=b.strokeRel;
    strokePath(dctx, pts, th.wave, w);
    const p=progress();
    if(p<1){
      const L=arcLengths(pts);
      strokePath(dctx, trimByArc(pts,L,p,1), S.trim, w);
    }
  }
  function frame(now){
    follow(now);
    if(S.voiceMode){
      // the trim creeps forward with whoever is talking, and wraps
      livePos += follower*0.004;
      if(livePos>1) livePos=0;
    }
    draw(now);
    const mv=$('meter'); if(mv){ mv.style.width=(follower*100).toFixed(1)+'%';
      $('v-live').textContent=follower.toFixed(2); }
    if(!S.voiceMode && (!audio.paused || audio.currentTime>0)) drawPlayhead();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------- voice mode ----------------
  //
  // Try enters Ash's voice mode: the preview becomes the app's voice screen and
  // runs a REAL conversation over WebRTC -- the same shape as the app, which
  // negotiates WebRTC and streams Opus both ways against its gRPC service.
  //
  // This page cannot talk to Ash itself: that service is gRPC behind Firebase
  // auth, and a public page can hold neither the protos nor the credentials. So
  // the far end is a realtime voice API reached with a short-lived token minted
  // by your own endpoint (see voice-lab-server/worker.js). The voice you hear is
  // that provider's, not Willow or Cedar -- those are ElevenLabs voices and a
  // realtime model cannot speak in them.
  const TOKEN_ENDPOINT = null;   // e.g. 'https://voice-lab-token.<you>.workers.dev'

  let pc=null, dc=null, micStream=null, micLevel=0;
  let inCtx=null, inAnalyser=null, outCtx=null, outAnalyser=null, levelRaf=0;
  let remoteAudio=null, ashSpeaking=false;

  const setStatus = t => { $('vm-status').textContent = t; };
  const setSaid   = t => { $('vm-said').textContent = t; };

  function rms(analyser, buf){
    analyser.getFloatTimeDomainData(buf);
    let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    return Math.min(1, Math.sqrt(s/buf.length)/0.28);
  }

  async function enterVoiceMode(){
    S.voiceMode = true;
    $('vm').hidden = false;
    canvasCard.classList.add('is-vm');
    $('btn-try').style.display='none';
    $('vm-name').textContent = S.voice.label;
    buildDots();
    if(!audio.paused) audio.pause();
    livePos = 0; setSaid('');

    if(!TOKEN_ENDPOINT){
      setStatus('No voice endpoint configured — see voice-lab-server/worker.js');
      return;
    }
    try{
      await connectRealtime();
    }catch(err){
      setStatus(String(err.message || err));
    }
  }

  async function connectRealtime(){
    setStatus('Connecting…');

    // 1. short-lived token from your endpoint; the API key never reaches the page
    const tr = await fetch(TOKEN_ENDPOINT, { method:'POST' });
    if(!tr.ok) throw new Error('Token endpoint '+tr.status);
    const { token, model } = await tr.json();
    if(!token) throw new Error('Token endpoint returned no token');

    // 2. microphone
    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio:{
        echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    }catch(err){
      throw new Error(err && err.name==='NotAllowedError'
        ? 'Microphone blocked — allow it in your browser to talk'
        : 'No microphone available');
    }

    // 3. peer connection
    pc = new RTCPeerConnection();

    // Ash's audio comes back as a track; play it and measure it so the path
    // moves to the reply exactly as it moves to your own voice.
    remoteAudio = new Audio();
    remoteAudio.autoplay = true;
    pc.ontrack = (e) => {
      remoteAudio.srcObject = e.streams[0];
      outCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = outCtx.createMediaStreamSource(e.streams[0]);
      outAnalyser = outCtx.createAnalyser();
      outAnalyser.fftSize = 1024; outAnalyser.smoothingTimeConstant = 0.25;
      src.connect(outAnalyser);
    };

    pc.addTrack(micStream.getAudioTracks()[0], micStream);

    inCtx = new (window.AudioContext||window.webkitAudioContext)();
    const isrc = inCtx.createMediaStreamSource(micStream);
    inAnalyser = inCtx.createAnalyser();
    inAnalyser.fftSize = 1024; inAnalyser.smoothingTimeConstant = 0.25;
    isrc.connect(inAnalyser);

    const inBuf = new Float32Array(inAnalyser.fftSize);
    let outBuf = null;
    const tick = () => {
      const mine = inAnalyser ? rms(inAnalyser, inBuf) : 0;
      let theirs = 0;
      if(outAnalyser){
        if(!outBuf) outBuf = new Float32Array(outAnalyser.fftSize);
        theirs = rms(outAnalyser, outBuf);
      }
      // whoever is louder drives the path
      micLevel = Math.max(mine, theirs);
      levelRaf = requestAnimationFrame(tick);
    };
    tick();
    S.live = true;

    // 4. events
    dc = pc.createDataChannel('oai-events');
    dc.onmessage = (e) => {
      let ev; try{ ev = JSON.parse(e.data); }catch(_){ return; }
      switch(ev.type){
        case 'input_audio_buffer.speech_started': setStatus('Listening…'); setSaid(''); break;
        case 'input_audio_buffer.speech_stopped': setStatus('Thinking…'); break;
        case 'conversation.item.input_audio_transcription.completed':
          if(ev.transcript) setSaid(ev.transcript.trim()); break;
        case 'response.audio_transcript.delta':
          if(ev.delta){ ashSpeaking = true; setStatus('Ash is speaking');
                        setSaid(($('vm-said').dataset.reply = ($('vm-said').dataset.reply||'')+ev.delta).slice(-120)); }
          break;
        case 'response.audio_transcript.done':
          $('vm-said').dataset.reply=''; break;
        case 'response.done':
          ashSpeaking = false; setStatus('Listening…'); break;
        case 'error':
          setStatus('Error: '+(ev.error && ev.error.message || 'unknown')); break;
      }
    };

    // 5. SDP handshake
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes = await fetch('https://api.openai.com/v1/realtime?model='+encodeURIComponent(model), {
      method:'POST',
      headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/sdp' },
      body: offer.sdp,
    });
    if(!sdpRes.ok) throw new Error('Realtime handshake '+sdpRes.status);
    await pc.setRemoteDescription({ type:'answer', sdp: await sdpRes.text() });

    setStatus('Listening…');
    $('live-dot').classList.add('is-live');
  }

  function exitVoiceMode(){
    S.voiceMode=false; S.live=false; micLevel=0; ashSpeaking=false;
    $('vm').hidden = true;
    canvasCard.classList.remove('is-vm');
    $('btn-try').style.display='';
    cancelAnimationFrame(levelRaf);
    if(dc){ try{ dc.close(); }catch(_){ } dc=null; }
    if(pc){ try{ pc.close(); }catch(_){ } pc=null; }
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    if(inCtx){ inCtx.close(); inCtx=null; } inAnalyser=null;
    if(outCtx){ outCtx.close(); outCtx=null; } outAnalyser=null;
    if(remoteAudio){ remoteAudio.srcObject=null; remoteAudio=null; }
    $('live-dot').classList.remove('is-live');
    livePos=0; setSaid(''); setStatus('Tap to speak');
  }

  function buildDots(){
    const d=$('vm-dots'); d.innerHTML='';
    VOICES.forEach(v=>{
      const b=document.createElement('button');
      b.className='vm__dot'+(v===S.voice?' is-on':'');
      b.title=v.label;
      b.addEventListener('click',()=>{
        S.voice=v; $('vm-name').textContent=v.label;
        voicesEl.querySelectorAll('.voice').forEach(x=>x.classList.toggle('is-on',x.dataset.id===v.id));
        buildDots();
      });
      d.appendChild(b);
    });
  }

  $('btn-try').addEventListener('click', enterVoiceMode);
  $('vm-back').addEventListener('click', exitVoiceMode);
  window.addEventListener('pagehide', exitVoiceMode);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.voiceMode) exitVoiceMode(); });

  // ---------------- waveform ----------------
  const wave=$('wave');
  function drawWave(){
    const dpr=window.devicePixelRatio||1, w=waveWrap.clientWidth, h=waveWrap.clientHeight;
    wave.width=w*dpr; wave.height=h*dpr;
    const c=wave.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
    if(!currentEnv) return;
    const env=currentEnv.env, n=env.length, bars=Math.min(n,Math.floor(w/3)), bw=w/bars, mid=h/2;
    c.fillStyle=(getComputedStyle(document.body).getPropertyValue('--ink-3')||'#aaa').trim();
    for(let i=0;i<bars;i++){
      const a=Math.floor(i*n/bars), b=Math.max(a+1,Math.floor((i+1)*n/bars));
      let m=0; for(let k=a;k<b;k++) m=Math.max(m,env[k]);
      const bh=Math.max(2,m*(h-16));
      c.beginPath();
      if(c.roundRect) c.roundRect(i*bw+bw*.2, mid-bh/2, bw*.6, bh, 1.5); else c.rect(i*bw+bw*.2, mid-bh/2, bw*.6, bh);
      c.fill();
    }
  }
  function drawPlayhead(){
    const d=audio.duration||(currentEnv&&currentEnv.duration_s)||1;
    playhead.style.left=(Math.min(1,audio.currentTime/d)*waveWrap.clientWidth)+'px';
    $('time').textContent=fmt(audio.currentTime)+' / '+fmt(d);
  }
  const fmt = t => { if(!isFinite(t)) t=0; const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(2); };

  // ---------------- audio ----------------
  function setSample(name){
    S.sample=name;
    if(customEnvs[name]){ currentEnv=customEnvs[name]; audio.src=name; $('file-name').textContent=customEnvs[name].label; }
    else { currentEnv=ENVS[name]||null; audio.src='./audio/'+name; $('file-name').textContent=name; }
    audio.load(); drawWave(); drawPlayhead();
  }
  $('btn-play').addEventListener('click', ()=>{ if(S.voiceMode) exitVoiceMode(); audio.paused ? audio.play() : audio.pause(); });
  audio.addEventListener('play', ()=>{ $('ic-play').style.display='none'; $('ic-pause').style.display=''; $('live-dot').classList.add('is-live'); });
  audio.addEventListener('pause',()=>{ $('ic-play').style.display=''; $('ic-pause').style.display='none'; if(!S.voiceMode) $('live-dot').classList.remove('is-live'); });
  audio.addEventListener('ended', ()=>{ audio.currentTime=0; drawPlayhead(); });
  audio.addEventListener('loadedmetadata', drawPlayhead);
  audio.addEventListener('seeked', drawPlayhead);
  waveWrap.addEventListener('click', e=>{
    const r=waveWrap.getBoundingClientRect();
    if(audio.duration) audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
    drawPlayhead();
  });
  $('file-input').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return;
    const url=URL.createObjectURL(f);
    try{
      const ac=new (window.AudioContext||window.webkitAudioContext)();
      const buf=await ac.decodeAudioData(await f.arrayBuffer());
      const ch=buf.getChannelData(0), fps=60, win=Math.floor(buf.sampleRate/fps), env=[];
      for(let i=0;i<ch.length;i+=win){ let s=0,n=0; for(let k=i;k<Math.min(ch.length,i+win);k++){s+=ch[k]*ch[k];n++;} env.push(Math.sqrt(s/Math.max(1,n))); }
      const peak=Math.max(...env)||1; for(let i=0;i<env.length;i++) env[i]=+(env[i]/peak).toFixed(3);
      customEnvs[url]={fps,env,duration_s:buf.duration,label:f.name}; ac.close();
    }catch(err){ customEnvs[url]={fps:60,env:[],duration_s:0,label:f.name}; }
    let opt=$('audio-select').querySelector('option[value="__custom__"]');
    if(!opt){ opt=document.createElement('option'); opt.value='__custom__'; $('audio-select').appendChild(opt); }
    opt.textContent='Uploaded · '+f.name; opt.dataset.url=url; $('audio-select').value='__custom__';
    setSample(url);
  });

  // ---------------- UI ----------------
  const voicesEl=$('voices');
  VOICES.forEach(v=>{
    const b=document.createElement('button');
    b.className='voice'+(v===S.voice?' is-on':''); b.dataset.id=v.id;
    b.innerHTML='<span class="voice__dot"></span><span>'+v.label+'</span>'+(v.legacy?'<span class="voice__meta">legacy</span>':'');
    b.addEventListener('click',()=>{
      S.voice=v; voicesEl.querySelectorAll('.voice').forEach(x=>x.classList.toggle('is-on',x===b));
      $('badge-voice').textContent=v.label; $('badge-file').textContent=v.id+' · path';
      if(!customEnvs[S.sample]){ setSample(v.wav); $('audio-select').value=v.wav; }
    });
    voicesEl.appendChild(b);
  });
  SAMPLES.forEach(([f,l])=>{ const o=document.createElement('option'); o.value=f; o.textContent=l; $('audio-select').appendChild(o); });
  $('audio-select').value=S.sample;
  $('audio-select').addEventListener('change', e=>{
    const v=e.target.value; setSample(v==='__custom__' ? e.target.selectedOptions[0].dataset.url : v);
  });
  TRIMS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='sw'+(i===0?' is-on':''); b.dataset.v=c;
    b.style.background=c; b.style.setProperty('--sw',c); b.title=c;
    b.addEventListener('click',()=>{ S.trim=c; document.body.style.setProperty('--trim',c);
      $('sw-trim').querySelectorAll('.sw').forEach(x=>x.classList.toggle('is-on',x===b)); });
    $('sw-trim').appendChild(b);
  });
  document.body.style.setProperty('--trim', S.trim);
  $('tabs').querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    $('tabs').querySelectorAll('.tab').forEach(x=>x.classList.toggle('is-on',x===t));
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('is-on', p.dataset.pane===t.dataset.v));
  }));
  $('theme').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    S.theme=b.dataset.v; document.body.setAttribute('data-theme',S.theme);
    $('theme').querySelectorAll('button').forEach(x=>x.classList.toggle('is-on',x===b));
    drawWave();
  }));
  const bindSlider=(id,key,fmtFn,valueId)=>{
    const el=$(id), out=$(valueId);
    const paint=()=>{ el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%'); out.textContent=fmtFn(+el.value); };
    el.addEventListener('input',()=>{ S[key]=+el.value; paint(); }); paint();
  };
  bindSlider('s-amp','manualAmp',v=>v.toFixed(2),'v-amp');
  // reaching for Amplitude means you want to set it by hand
  $('s-amp').addEventListener('pointerdown',()=>{
    if(S.driveAudio) $('tg-audio').click();
  });
  bindSlider('s-gain','gain',v=>v.toFixed(2).replace(/0$/,'')+'×','v-gain');
  bindSlider('s-attack','attack',v=>v+' ms','v-attack');
  bindSlider('s-release','release',v=>v+' ms','v-release');
  bindSlider('s-floor','floor',v=>v.toFixed(2),'v-floor');
  $('tg-audio').addEventListener('click',()=>{
    S.driveAudio=!S.driveAudio;
    $('tg-audio').classList.toggle('is-on',S.driveAudio);
    $('tg-audio').setAttribute('aria-checked',String(S.driveAudio));
    $('s-amp').disabled=S.driveAudio;
  });
  $('seg-curve').querySelectorAll('.seg__opt').forEach(b=>b.addEventListener('click',()=>{
    $('seg-curve').querySelectorAll('.seg__opt').forEach(x=>x.classList.toggle('is-on',x===b));
    S.curve=b.dataset.v;
  }));
  new ResizeObserver(()=>{ drawWave(); drawPlayhead(); }).observe(waveWrap);

  window.__lab = { S, get PATHS(){return PATHS;}, base, deform, arcLengths, trimByArc,
                   setSmooth:(w,p,r)=>{SMOOTH_WIN=w;SMOOTH_PASS=p;if(r!==undefined)RDP_REL=r;for(const k in CACHE) delete CACHE[k];},
                   progress, enterVoiceMode, exitVoiceMode, connectRealtime,
                   get follower(){return follower;}, get ashSpeaking(){return ashSpeaking;},
                   set micLevel(v){ micLevel=v; } };
})();
</script>
</body>
</html>
